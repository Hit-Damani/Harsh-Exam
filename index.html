<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ApexExam Pro — Online Examination & Assessment Platform</title>
  <meta name="description" content="Professional, secure online examination platform with configurable negative marking, live countdown timer, autosave, and detailed analytics." />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'%3E%3Cpath d='M12 2L1 7l11 5 9-4.09V17h2V7L12 2z'/%3E%3Cpath d='M4.5 10.5V16c0 2.5 3.5 4.5 7.5 4.5s7.5-2 7.5-4.5v-5.5l-7.5 3.5-7.5-3.5z'/%3E%3C/svg%3E" />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- App Stylesheets -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/exam.css" />

  <!-- Supabase JS SDK v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="app-container">
    <!-- Main Top Navigation -->
    <header class="navbar" id="main-navbar">
      <div class="container">
        <div class="navbar-inner">
          <!-- Brand Logo -->
          <a href="#/login" class="brand-logo">
            <div class="logo-icon">
              <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <div class="logo-text">Apex<span>Exam</span></div>
          </a>

          <!-- Navigation Links (Desktop) -->
          <ul class="nav-links" id="navbar-links-section">
            <!-- Rendered dynamically -->
          </ul>

          <!-- Nav Controls (Theme Toggle, Profile, Mobile Menu Button) -->
          <div class="nav-user">
            <button id="theme-toggle-btn" class="btn btn-icon btn-secondary" title="Toggle Theme" aria-label="Toggle Theme">
              <i id="theme-toggle-icon" class="fa-solid fa-sun"></i>
            </button>

            <div id="navbar-user-section" class="flex-center gap-2">
              <!-- Rendered dynamically -->
            </div>

            <!-- Mobile Hamburger Button -->
            <button id="mobile-menu-toggle-btn" class="btn btn-icon btn-secondary mobile-only" title="Toggle Menu" aria-label="Toggle Menu">
              <i class="fa-solid fa-bars" id="mobile-menu-icon"></i>
            </button>
          </div>
        </div>

        <!-- Mobile Navigation Drawer / Dropdown -->
        <div id="mobile-nav-drawer" class="mobile-nav-drawer">
          <ul class="mobile-nav-links" id="mobile-navbar-links-section">
            <!-- Rendered dynamically for mobile -->
          </ul>
        </div>
      </div>
    </header>

    <!-- Main Viewport Router Outlet -->
    <main id="app-main" class="main-content" role="main">
      <div class="page-loader">
        <div class="loading-spinner"></div>
        <p class="text-muted">Loading platform...</p>
      </div>
    </main>

    <!-- Global Toast Notification Container -->
    <div id="toast-container" aria-live="polite"></div>

    <!-- Global Modal Dialog Container -->
    <div id="global-modal-backdrop" class="modal-backdrop" role="dialog" aria-modal="true">
      <div class="modal-container">
        <div class="modal-header">
          <h3 class="modal-title" id="modal-title-text">Modal Title</h3>
          <button id="modal-close-btn" class="toast-close" aria-label="Close modal">&times;</button>
        </div>
        <div class="modal-body" id="modal-body-content">
          <!-- Dynamic Content -->
        </div>
        <div class="modal-footer" id="modal-footer-content">
          <!-- Dynamic Buttons -->
        </div>
      </div>
    </div>
  </div>

  <!-- Application Bootstrap Module -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
